services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - UPLOADS_DIR=/app/uploads
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/timon_costa_chica}
      - JWT_SECRET=${JWT_SECRET:-cambia-esta-clave-secreta-en-coolify}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  uploads_data:
